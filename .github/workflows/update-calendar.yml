name: Update Bikram Sambat calendar

on:
  schedule:
    - cron: "17 3 1 * *"  # 03:17 UTC on the 1st of every month
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Re-scrape and extend the calendar
        run: python3 scrape_bs_calendar.py --extend -o bikram_sambat_calendar.ics

      - name: Commit and push if the calendar changed
        run: |
          if git diff --quiet -- bikram_sambat_calendar.ics; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bikram_sambat_calendar.ics
          git commit -m "Update Bikram Sambat calendar"
          git push
